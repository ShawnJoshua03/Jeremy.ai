# Render blueprint (free tier). Secrets are set in the Render dashboard, not here.
# Free web services sleep when idle and lose the SQLite file on restart: demo use only.
services:
  - type: web
    name: jeremy-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        value: https://jeremywantstobeasurgeon.us,https://www.jeremywantstobeasurgeon.us,https://jeremy-dashboard.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false

  - type: web
    name: jeremy-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://jeremy-api.onrender.com/api/v1
      - key: VITE_CONVEX_URL
        value: https://careful-magpie-841.convex.cloud
      - key: VITE_SPACETIMEDB_URI
        value: wss://maincloud.spacetimedb.com
      - key: VITE_SPACETIMEDB_DB
        value: jeremy-ai-call
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
