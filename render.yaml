# Render blueprint (free tier). Secrets are set in the Render dashboard, not here.
# Free web services sleep when idle and lose the SQLite file on restart: demo use only.
services:
  - type: web
    name: jeremy-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        value: https://jeremywantstobeasurgeon.us,https://www.jeremywantstobeasurgeon.us
      - key: GEMINI_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
