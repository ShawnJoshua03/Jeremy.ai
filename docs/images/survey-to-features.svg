<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 484" width="760" height="484" role="img" aria-labelledby="t d"><title id="t">Survey asks mapped to features</title><desc id="d">What respondents asked for and what Jeremy.ai does about it</desc><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs><rect width="760" height="484" rx="18" fill="#0b1220"/><text x="32" y="46" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#e8eefc" font-weight="700" text-anchor="start">What they asked for  →  what we built</text><text x="32" y="72" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8fa0c0" font-weight="400" text-anchor="start">Every row traces to a survey answer</text><rect x="32" y="96" width="290" height="38" rx="10" fill="#131c2e" stroke="#24304a"/><text x="48" y="120" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e8eefc" font-weight="600" text-anchor="start">Safe, repeatable practice</text><path d="M326 115 H 400" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="0"/><path d="M394 109 l8 6 l-8 6" fill="none" stroke="#2dd4bf" stroke-width="2"/><rect x="410" y="96" width="318" height="38" rx="10" fill="#131c2e" stroke="#2dd4bf" stroke-dasharray="0"/><text x="424" y="120" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e8eefc" font-weight="400" text-anchor="start">Local Quest sim, unlimited attempts</text><rect x="32" y="148" width="290" height="38" rx="10" fill="#131c2e" stroke="#24304a"/><text x="48" y="172" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e8eefc" font-weight="600" text-anchor="start">Feedback on what I did</text><path d="M326 167 H 400" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="0"/><path d="M394 161 l8 6 l-8 6" fill="none" stroke="#2dd4bf" stroke-width="2"/><rect x="410" y="148" width="318" height="38" rx="10" fill="#131c2e" stroke="#2dd4bf" stroke-dasharray="0"/><text x="424" y="172" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e8eefc" font-weight="400" text-anchor="start">Deterministic scorecard + replay + AI coach</text><rect x="32" y="200" width="290" height="38" rx="10" fill="#131c2e" stroke="#24304a"/><text x="48" y="224" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e8eefc" font-weight="600" text-anchor="start">Ask questions, get the why</text><path d="M326 219 H 400" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="0"/><path d="M394 213 l8 6 l-8 6" fill="none" stroke="#2dd4bf" stroke-width="2"/><rect x="410" y="200" width="318" height="38" rx="10" fill="#131c2e" stroke="#2dd4bf" stroke-dasharray="0"/><text x="424" y="224" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e8eefc" font-weight="400" text-anchor="start">Coach Q&amp;A (Gemini), spoken by Cartesia</text><rect x="32" y="252" width="290" height="38" rx="10" fill="#131c2e" stroke="#24304a"/><text x="48" y="276" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e8eefc" font-weight="600" text-anchor="start">Accuracy I can trust</text><path d="M326 271 H 400" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="0"/><path d="M394 265 l8 6 l-8 6" fill="none" stroke="#2dd4bf" stroke-width="2"/><rect x="410" y="252" width="318" height="38" rx="10" fill="#131c2e" stroke="#2dd4bf" stroke-dasharray="0"/><text x="424" y="276" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e8eefc" font-weight="400" text-anchor="start">Cited rules; Gemini never scores</text><rect x="32" y="304" width="290" height="38" rx="10" fill="#131c2e" stroke="#24304a"/><text x="48" y="328" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e8eefc" font-weight="600" text-anchor="start">Instructor / attending input</text><path d="M326 323 H 400" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="0"/><path d="M394 317 l8 6 l-8 6" fill="none" stroke="#2dd4bf" stroke-width="2"/><rect x="410" y="304" width="318" height="38" rx="10" fill="#131c2e" stroke="#2dd4bf" stroke-dasharray="0"/><text x="424" y="328" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e8eefc" font-weight="400" text-anchor="start">Live Convex dashboard; notes reach the headset</text><rect x="32" y="356" width="290" height="38" rx="10" fill="#131c2e" stroke="#24304a"/><text x="48" y="380" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e8eefc" font-weight="600" text-anchor="start">Cost effective</text><path d="M326 375 H 400" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="0"/><path d="M394 369 l8 6 l-8 6" fill="none" stroke="#2dd4bf" stroke-width="2"/><rect x="410" y="356" width="318" height="38" rx="10" fill="#131c2e" stroke="#2dd4bf" stroke-dasharray="0"/><text x="424" y="380" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e8eefc" font-weight="400" text-anchor="start">Headset-based + itemized OR cost estimate</text><rect x="32" y="408" width="290" height="38" rx="10" fill="#131c2e" stroke="#24304a"/><text x="48" y="432" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e8eefc" font-weight="600" text-anchor="start">Videos, more patients, timed modes</text><path d="M326 427 H 400" stroke="#8fa0c0" stroke-width="2" stroke-dasharray="4 4"/><path d="M394 421 l8 6 l-8 6" fill="none" stroke="#8fa0c0" stroke-width="2"/><rect x="410" y="408" width="318" height="38" rx="10" fill="#131c2e" stroke="#8fa0c0" stroke-dasharray="4 4"/><text x="424" y="432" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8fa0c0" font-weight="400" text-anchor="start">On the roadmap</text></svg>